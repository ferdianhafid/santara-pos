// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Gradle and AAPT can fail when the repository path contains non-ASCII
// characters on Windows. The build script sets this to an ASCII-only location
// outside OneDrive while keeping all source files in the repository.
def externalBuildRoot = System.getenv('CAFE_POS_ANDROID_BUILD_DIR')
if (externalBuildRoot) {
    rootProject.buildDir = file("${externalBuildRoot}/root")
    subprojects {
        project.buildDir = file("${externalBuildRoot}/${project.name}")
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
